name: Build FPK (arm + x86)

# 双架构 fpk 打包：arm（aarch64）+ x86（x86_64）。
# 触发方式：
#   - 自动·正式发版主路径：被 publish.yml 以 workflow_call 调用（merge 后同 run 直调。
#     GITHUB_TOKEN 推的 tag 不产生 push 事件——recursion 防套娃规则——所以自动发版
#     必须走显式调用，见 publish.yml）。
#   - 自动·兼容路径：push tag v*（NAS 上手动 `git tag && push` 时仍直达）。
#   - 手动：workflow_dispatch（tag/mode/runtime 三个输入；test 模式只出 artifact 不发 Release）。
#
# 关键点：
#   - setup-node 用 Node 24（ABI 137），因为 fpk manifest 声明 install_dep_apps=nodejs_v24，
#     目标 NAS 运行时是 Node 24；better-sqlite3 会按当前 Node ABI 下载预编译二进制
#     （v12.11.1 有 node-v137 的 x86_64 / aarch64 prebuild），CI 无需交叉编译。
#   - npm run build:web 复用 ci.yml 的空库构建方式（MEDIA_TRACK_SQLITE_PATH: ""）。
#   - fnpack 官方二进制：https://static2.fnnas.com/fnpack/fnpack-<ver>-linux-<amd64|arm64>
#     （amd64|arm64 是官方下载 URL 的后缀，官方只提供这两种命名；二进制 statically linked，
#      两个 runner 直接可跑；sha256 已按官方发布值固定校验）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.2.0, 与 fpk 版本号一致)"
        required: false
        default: ""
      mode:
        description: "打包模式：release=正式版（默认）；test=测试版（appname=media-robot-dev、端口3334、独立数据目录，装/卸不影响正式版）"
        required: false
        default: release
        type: choice
        options:
          - release
          - test
      runtime:
        description: "运行模式：normal=真实 LLM+真实网盘（默认）；fake=stub 脚本+假网盘，零配置零费用；demo=只读演示站（fake 数据+禁止写操作）"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - fake
          - demo

  workflow_call:
    inputs:
      tag:
        description: "要发布的 tag（必填；Release job 以它为准）"
        type: string
        required: true
      mode:
        type: string
        required: false
        default: release
      runtime:
        type: string
        required: false
        default: normal

permissions:
  contents: read

env:
  # 注意：官方 fnpack（1.2.0 / 1.2.1 均如此）打包时会把源内容符号链接改写为指向自身
  # 的死链，fnOS 安装器对死链 acl_get_file 跟随死循环（ELOOP），报 10234 设置目录权限
  # 失败。build-fpk.sh 2.55 节已在打包前消除所有符号链接，故版本固定 1.2.0 仅为稳定。
  FNPACK_VERSION: "1.2.0"
  # 与 ci.yml 相同的"空库构建"条件：值被设置为空字符串，不会被 next.config 的 ??= 覆盖。
  MEDIA_TRACK_SQLITE_PATH: ""

jobs:
  build:
    name: Build fpk (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch / artifact / platform 统一为 arm | x86（影响 job 名与 artifact 名）；
          # runner 是 GitHub 官方 runner 名（ubuntu-24.04-arm / ubuntu-latest）、
          # fnpack_arch 是官方下载 URL 的后缀（static2.fnnas.com 只提供 amd64 | arm64），
          # 均为外部命名无法修改，保持不变。
          - arch: arm
            runner: ubuntu-24.04-arm
            platform: arm
            fnpack_arch: arm64
            fnpack_sha256: 33a76a7c685832b8de1adff3a6362c384bf367988d819e98bcf85569bb219d30
            artifact: fpk-arm
          - arch: x86
            runner: ubuntu-latest
            platform: x86
            fnpack_arch: amd64
            fnpack_sha256: 523227c950a589ab3af327cf91c45511154265487bf723b29da9cfa2e0dc9d5a
            artifact: fpk-x86

    steps:
      - uses: actions/checkout@v7

      # workflow_dispatch 指定了 tag 时，切到该 tag 对应的提交再构建，
      # 保证产物与发布的版本一致。
      - name: Checkout tag commit (dispatch/call with tag)
        # push tag 事件里 inputs.tag 为空串 → 天然跳过（checkout 已在该 tag 的 SHA 上）。
        if: inputs.tag != ''
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            git checkout "${{ inputs.tag }}"
          else
            echo "::error::Tag ${{ inputs.tag }} does not exist. Create it first: git tag ${{ inputs.tag }} && git push origin ${{ inputs.tag }}"
            exit 1
          fi

      # Node 24（ABI 137）= fpk 依赖的 nodejs_v24 运行时，保证原生模块 ABI 匹配。
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fnpack (${{ matrix.fnpack_arch }})
        run: |
          curl -fsSL -o /tmp/fnpack "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-${{ matrix.fnpack_arch }}"
          echo "${{ matrix.fnpack_sha256 }}  /tmp/fnpack" | sha256sum -c -
          chmod +x /tmp/fnpack
          # GITHUB_PATH 只对后续 step 生效，当前 step 内 PATH 未更新，故用完整路径调用。
          echo "/tmp" >> "${GITHUB_PATH}"
          /tmp/fnpack --help >/dev/null
          echo "fnpack OK: /tmp/fnpack"

      - name: Resolve fpk version
        id: version
        run: |
          V=""
          # ⚠️ 先看 inputs.tag，**不要**先看 event_name：被 publish.yml 以 workflow_call
          # 调用时 github context 是**调用方**的（event_name 显示成 push、ref_name 是
          # main），于是原来的判断取到 V=main —— 产物名变成 media-robot-main-arm.fpk，
          # manifest 里的 version 也被 sed 成 "main"（v1.0.2 / v1.0.3 连续两版都这样，
          # 不只是文件名难看，是包内版本号错了）。下面的 release job 早就按这个判据写
          # （见其 if 与 Determine release tag 的注释），这里与它对齐。
          if [ -n "${{ inputs.tag }}" ]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          # 不带 tag 的手动构建:V 为空 → build-fpk.sh 回退读 package.json;
          # 上传 path 必须用同一个版本号,否则 artifact 路径匹配失败(if-no-files-found: error)。
          if [ -z "${V}" ]; then
            V="$(node -p "require('./package.json').version" 2>/dev/null)" || V="1.0.0"
          fi
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

      # 复用现有打包脚本：tsc workflow + next build standalone + 填充 app/server + fnpack build。
      # VERSION 为空时脚本回退读 package.json；ARCH 决定 manifest platform 与产物名；
      # FPK_MODE=test 时打出独立测试版（media-robot-dev，端口3334），不影响正式版数据；
      # FPK_RUNTIME=fake 时 agent/网盘走 stub+fake（不调 LLM、不碰真网盘），产物带 -fake 后缀。
      - name: Build fpk (VERSION + ARCH + MODE + RUNTIME)
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.platform }}
          FPK_MODE: ${{ inputs.mode }}
          FPK_RUNTIME: ${{ inputs.runtime }}
        run: |
          ./deploy/fpk/build-fpk.sh
          # ⚠️ 产物路径由脚本写进 $GITHUB_OUTPUT —— 命名逻辑只存在于 build-fpk.sh
          # 一处（见脚本内那段注释：以前 workflow 自己拼名字，在「直接推 tag」
          # 那条路上 inputs 全为空串，会拼出 media-robot--1.0.0-arm.fpk 这种名字）。
          # 空路径必须当场失败，否则 upload 会拿空 path 报一个看不懂的错。
          if [ ! -f "${GITHUB_OUTPUT}" ] || ! grep -q '^artifact_path=.' "${GITHUB_OUTPUT}"; then
            echo "::error::build-fpk.sh 没有输出 artifact_path —— 无法确定要上传哪个文件"
            exit 1
          fi

      - name: Upload fpk artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'test' && format('fpk-{0}-dev-{1}', matrix.arch, inputs.runtime) || format('fpk-{0}-{1}', matrix.artifact, inputs.runtime) }}
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  # 发布闸门：只有两个架构的 build 都成功才发 Release（避免只挂上一个架构）。
  # 仅 tag push 或 workflow_dispatch 带 tag 输入时执行；纯手动验证（不带 tag）只传 artifact。
  # test 模式不发布 Release（测试包只作为 artifact 下载，不进正式 Release）。
  release:
    needs: [build]
    # 三种触发统一判据：要么本来就在 tag ref 上（push tag），要么显式给了 tag
    # （dispatch / workflow_call）。mode=test 永不发。不用 event_name 判断——
    # 被调用时 github context 是调用方的，event_name 会显示成 'push'。
    if: needs.build.result == 'success' && (github.ref_type == 'tag' || inputs.tag != '') && inputs.mode != 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      # ⚠️ 这个 checkout 必须排在 download-artifact **之前**：
      # actions/checkout 的 `clean` 默认是 true，会跑 `git clean -ffdx`；而
      # download-artifact 把 *.fpk 放在工作区的 dist/（未跟踪）里 —— 于是 checkout
      # 会把产物整个删掉，最后报
      #   Pattern 'dist/*.fpk' does not match any files
      # （2026-09-26 首次发版就这样挂了）。放在前面时工作区还是空的，clean 无害。
      # 这里另写 clean: false 兜底：将来若有人调顺序，不至于又静默删产物。
      #
      # 发布正文 = 仓库根目录的 RELEASE_NOTES.md，只读它、不在发布时拼接内容。
      # 那份文件由 release.yml 在 bump PR 里生成 —— 所以**你在开/合 PR 时就能看到
      # 并直接编辑**将要发布的文字（在 PR 的 Files changed 里改它即可）。内容一旦
      # 在 PR 里审过，就不该在发布那一刻悄悄变样，故这里不做二次生成。
      # （也因此不用 action 的 generate_release_notes：那是 GitHub 从「上个
      # release 以来合并的 PR」自动生成，首版会把所有 PR 列一遍，且无法在合并前
      # 审阅。）
      - name: Checkout (按 tag 读 RELEASE_NOTES.md)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          clean: false
        # 手动 dispatch 指定的 tag 可能还没创建（softprops 会在发布时创建它），
        # 那种情况 checkout 会失败 —— 不让它拖垮发布，下面有兜底正文。
        continue-on-error: true

      - name: Download fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release body
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES.md"
          if [ -f "${NOTES}" ]; then
            cp "${NOTES}" "${RUNNER_TEMP}/release-body.md"
            echo "正文来源: ${NOTES}（$(wc -c < "${NOTES}" | tr -d ' ') 字节）"
          elif [ -f .github/release-notes.template.md ]; then
            cp .github/release-notes.template.md "${RUNNER_TEMP}/release-body.md"
            echo "::notice::${NOTES} 不存在（老 tag 或 checkout 失败），改用模板"
          else
            printf '%s\n' "Media Robot 发布。" > "${RUNNER_TEMP}/release-body.md"
            echo "::warning::${NOTES} 与模板都取不到，正文用占位一句"
          fi
          echo "--- 正文预览（前 20 行）---"
          head -20 "${RUNNER_TEMP}/release-body.md"

      - name: Upload fpk files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Media Robot ${{ steps.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/*.fpk
          fail_on_unmatched_files: true
