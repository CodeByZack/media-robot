# 一键发版·上篇：自动生成「版本号 bump PR + 本版改动说明」，然后停下。
# 合并由人工把关（AGENTS.md 铁律：PR 必须人合）。你 merge 之后，publish.yml
# 检测到 main 上版本变化自动打 v<X.Y.Z> tag → 触发既有 build-fpk.yml（release
# 模式双架构）→ release job 把 *.fpk 挂上 GitHub Release（附 GitHub 自动
# changelog）。
#
# 用法：Actions → Release → Run workflow → version 留空 = 自动 patch+1
#       （0.0.4 → 0.0.5）；或显式填 0.1.0 / 1.0.0。
# ⚠️ workflow_dispatch 只对 default 分支上存在的 workflow 可见——合入 main 后即可用。
name: Release (开 bump PR + 改动说明)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "新版本号，不带 v（例 0.0.5；留空 = 当前版本 patch +1）"
        required: false
        default: ""

permissions:
  contents: write      # push release 分支（含读历史/tag）
  pull-requests: write # 开 PR

run-name: "Release v${{ inputs.version || '(auto patch+1)' }}"

jobs:
  bump-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history for changelog)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve target version
        id: ver
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "${INPUT}" ]; then
            VERSION="${INPUT}"
          else
            MAJOR=$(echo "${CURRENT}" | cut -d. -f1)
            MINOR=$(echo "${CURRENT}" | cut -d. -f2)
            PATCH=$(echo "${CURRENT}" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::非法版本号: ${VERSION}"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1 \
            && { echo "::error::tag v${VERSION} 已存在，填个更高的版本号"; exit 1; }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"

      - name: Collect changelog since last tag
        id: log
        run: |
          set -euo pipefail
          # 最近一个 v* 祖先 tag：直接列 remote tags（merge-base 判祖先），
          # 不依赖 describe 的祖先可达性（浅历史/多分支下更稳）。
          #
          # ⚠️ 用 `--refs` 而不是 `| grep -v '\^{}'` 过滤 peeled 引用：
          #    新仓库**一个 tag 都没有**时，ls-remote 输出为空 → `grep -v` 无匹配
          #    行 → **退出码 1** → `set -euo pipefail` 直接把整步判失败
          #    （2026-09-26 首次发版就撞上，卡在 "Collect changelog" 这一步）。
          #    `--refs`（官方语义：不输出 peeled tag）从根上不产生 `^{}` 行，
          #    空输入时 sed/sort/tail 都返回 0，整条管道不会误判。
          LAST_TAG=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -1)
          if [ -n "${LAST_TAG}" ] && git merge-base --is-ancestor "${LAST_TAG}" HEAD 2>/dev/null; then
            RANGE="${LAST_TAG}..HEAD"
          else
            LAST_TAG=""
            RANGE="HEAD"
          fi
          {
            echo "## 本版改动（${LAST_TAG:-repo 起点} → main）"
            echo ""
            git log "${RANGE}" --first-parent --pretty=format:'- %s (%h)' -n 200
            echo ""
            if [ -n "${LAST_TAG}" ]; then
              echo ""
              echo "完整 diff：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${LAST_TAG}...HEAD"
            fi
          } > "${RUNNER_TEMP}/commits.md"
          echo "last_tag=${LAST_TAG}" >> "${GITHUB_OUTPUT}"
          wc -l "${RUNNER_TEMP}/commits.md"

      - name: Bump package.json + 生成发布正文 RELEASE_NOTES.md + push branch
        env:
          LAST_TAG: ${{ steps.log.outputs.last_tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "release-bot[bot]"
          git config user.email "release-bot[bot]@users.noreply.github.com"
          git checkout -b "release/v${VERSION}"
          npm version "${VERSION}" --no-git-tag-version   # 同步 package.json + package-lock.json

          # 生成**发布正文**并让它随本 PR 一起走：这样「将要发布到 Release 页的文字」
          # 在合并前就能被看到和编辑 —— 在 PR 的 Files changed 里直接改
          # RELEASE_NOTES.md 即可。build-fpk.yml 发布时读的就是 tag 上这份文件，
          # 不再二次拼接：内容一旦在 PR 里审过，就不该在发布那一刻变样。
          {
            cat .github/release-notes.template.md
            if [ -n "${LAST_TAG}" ]; then
              echo
              echo "<details>"
              echo "<summary>本版改动（${LAST_TAG} → v${VERSION}）</summary>"
              echo
              git log "${LAST_TAG}..HEAD" --first-parent --pretty=format:'- %s (%h)' -n 200
              echo
              echo
              echo "</details>"
            fi
            # 首版（无更早 tag）刻意**不列**改动：那区间会退化成整个历史，对读者是噪音。
          } > RELEASE_NOTES.md
          echo "--- RELEASE_NOTES.md 预览（前 24 行）---"
          head -24 RELEASE_NOTES.md

          git add package.json package-lock.json RELEASE_NOTES.md
          git commit -m "chore(release): v${VERSION}"
          # 重跑幂等：失败重试时该分支若存在，必然是本 workflow 上轮的中间产物，
          # force 覆盖无他人内容风险。⚠️ 必须先 fetch 建立 remote-tracking ref——
          # 本地新建分支没有 tracking 时 --force-with-lease 会按「远端应不存在」
          # 处理，恰好在重试场景被 stale info 拒推（ocr review #65 抓到的真 bug）。
          git fetch origin "+refs/heads/release/v${VERSION}:refs/remotes/origin/release/v${VERSION}" || true
          git push --force-with-lease origin "release/v${VERSION}"
      - name: Open PR (留人工合并)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG="${{ steps.log.outputs.last_tag }}"
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          CURRENT="${{ steps.ver.outputs.current }}"
          {
            echo "把 \`package.json\` 的版本号从 \`${CURRENT}\` 提到 \`${VERSION}\`。"
            echo ""
            echo "**合并后不需要再做任何事**：\`publish.yml\` 会自动在 main 上打 \`v${VERSION}\` tag，"
            echo "随后 \`build-fpk.yml\`（release 模式，arm + x86）构建，把"
            echo "\`media-robot-${VERSION}-arm.fpk\` / \`-x86.fpk\` 挂到 GitHub Release。"
            echo ""
            echo "---"
            echo ""
            echo "### 发布说明就在这个 PR 里"
            echo ""
            echo "Release 页的正文 = 本 PR 新增/修改的 \`RELEASE_NOTES.md\`。"
            echo "**在 Files changed 里直接编辑它**，改完合并即可 —— 发布时读的就是它，"
            echo "不会在发布那一刻被重新生成或覆盖。"
            echo ""
            if [ -n "${LAST_TAG}" ]; then
              echo "下面折叠的是自动生成的默认内容（自 ${LAST_TAG} 以来的改动），按需删减。"
            else
              echo "这是**首个版本**：默认只放产品简介、不列改动（那个区间会退化成整个历史）。"
            fi
            echo ""
            echo "<details>"
            echo "<summary>RELEASE_NOTES.md 当前内容</summary>"
            echo ""
            cat RELEASE_NOTES.md
            echo ""
            echo "</details>"
          } > "${RUNNER_TEMP}/body.md"
          # 重跑幂等：先探测该 head 是否已有 PR（create 失败原因多样，不能拿
          # 422 兜底猜）；有则同步 body，无则新建。
          if gh pr view "release/v${VERSION}" >/dev/null 2>&1; then
            echo "PR 已存在，更新 body"
            gh pr edit "release/v${VERSION}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --base main --head "release/v${VERSION}" \
              --title "release: v${VERSION}" \
              --body-file "${RUNNER_TEMP}/body.md"
          fi
          gh pr view "release/v${VERSION}" --json number,url --template 'PR #{{.number}}: {{.url}}\n'
